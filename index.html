<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Pontas - Grande Aço</title>
  <style>
    :root {
      --primary: #0ea5e9;
      --primary-hover: #0284c7;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
    }

    [data-theme="dark"] {
      --primary: #38bdf8;
      --primary-hover: #7dd3fc;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 20px; transition: 0.3s; }
    .container { max-width: 800px; margin: 0 auto; }
    
    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .logo-container { display: flex; align-items: center; gap: 16px; }
    .logo-img { width: 80px; height: 80px; object-fit: contain; border-radius: 50%; background: #fff; padding: 4px; }
    .header-titles h1 { margin: 0; font-size: 1.5rem; }
    .header-titles p { margin: 0; color: var(--text-muted); font-size: 0.9rem; }
    
    .theme-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    
    /* Tabs */
    .tabs { display: flex; gap: 10px; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
    .tab { padding: 10px 20px; cursor: pointer; color: var(--text-muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Forms */
    .box { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
    .box h2 { margin-top: 0; font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
    select, input { padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 1rem; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #dc2626; }

    /* Results */
    .result-card { background: var(--bg); border: 1px solid var(--border); border-left: 4px solid var(--primary); border-radius: 8px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .result-info h3 { margin: 0 0 4px 0; font-size: 1.1rem; }
    .result-info p { margin: 0; color: var(--text-muted); font-size: 0.85rem; }
    .badge { background: var(--primary); color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; margin-right: 6px; }
    .sobra-box { text-align: right; }
    .sobra-val { font-size: 1.2rem; font-weight: bold; color: var(--primary); }

    /* Toasts */
    #toast { visibility: hidden; min-width: 250px; background-color: var(--success); color: #fff; text-align: center; border-radius: 6px; padding: 16px; position: fixed; z-index: 1; bottom: 30px; left: 50%; transform: translateX(-50%); font-weight: 600; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 3.5s; }
    #toast.error { background-color: var(--danger); }
    @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
    @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo-container">
        <img src="image_1d6ea0.png" alt="Logo" class="logo-img">
        <div class="header-titles">
          <h1>Controle de Pontas</h1>
          <p>Sistema Integrado de Estoque</p>
        </div>
      </div>
      <button class="theme-btn" onclick="toggleTheme()" id="btnTheme">🌙</button>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('consulta')">🔍 Consulta Rápida</div>
      <div class="tab" onclick="switchTab('gerenciar')">📋 Gerenciar Estoque</div>
    </div>

    <!-- ABA CONSULTA -->
    <div id="consulta" class="tab-content active">
      <div class="box">
        <h2>Buscar Pontas Disponíveis</h2>
        <div class="form-grid">
          <div class="form-group">
            <label>1. Bitola (mm)</label>
            <select id="buscaBitola"><option value="">Carregando...</option></select>
          </div>
          <div class="form-group">
            <label>2. Tamanho da barra (m)</label>
            <input type="number" id="buscaMedida" step="0.05" min="0" placeholder="Ex: 2.50">
          </div>
          <div class="form-group">
            <label>3. Quantidade desejada</label>
            <input type="number" id="buscaQtde" min="1" value="1">
          </div>
        </div>
        <button class="btn" onclick="buscarEstoque()">Procurar Estoque</button>
      </div>
      <div id="areaResultados"></div>
    </div>

    <!-- ABA GERENCIAR -->
    <div id="gerenciar" class="tab-content">
      <div class="box">
        <h2>➕ Cadastrar Nova Ponta</h2>
        <div class="form-grid">
          <div class="form-group">
            <label>Bitola (mm)</label>
            <input type="number" id="cadBitola" step="0.01" placeholder="Ex: 6.30">
          </div>
          <div class="form-group">
            <label>Medida (m)</label>
            <input type="number" id="cadMedida" step="0.01" placeholder="Ex: 5.50">
          </div>
          <div class="form-group">
            <label>Quantidade</label>
            <input type="number" id="cadQtde" min="1" value="1">
          </div>
        </div>
        <button class="btn" id="btnCadastrar" onclick="cadastrarPontas()">Confirmar Cadastro</button>
      </div>

      <div class="box">
        <h2>➖ Dar Baixa Manual (Saída)</h2>
        <div class="form-grid">
          <div class="form-group">
            <label>ID da Planilha</label>
            <input type="number" id="baixaId" placeholder="Ex: 342" oninput="preverBaixa()">
          </div>
        </div>
        
        <!-- Área onde aparece a barra ao ser pesquisada -->
        <div id="previewBaixa" style="margin-bottom: 15px;"></div>
        
        <button class="btn btn-danger" id="btnBaixar" onclick="baixarManual()" style="display:none;">Confirmar Baixa (Vendido)</button>
      </div>
    </div>
  </div>

  <div id="toast">Notificação</div>

  <script>
    // URL DO SEU SCRIPT
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxyg4MHYtu4-GPzV-Nz_7oy0sroUusx5HuIjkPFCQr9rno_q3GFcUPTVgwuXkz6ZrRy/exec";
    
    // Leitura Google Sheets
    const SPREADSHEET_ID = "1dtIpGk97RggIA7E-4diWtiEPa0GbI6d1i_F7UsA9CtI";
    const SHEET_NAME = "Pontas";
    let estoque = [];
    let barrasSelecionadas = []; 

    // Função à prova de falhas para ler números
    const parseNumSeguro = (obj) => {
      if (!obj) return 0;
      let val = obj.v !== undefined ? obj.v : obj.f;
      if (val === null || val === undefined || val === "") return 0;
      if (typeof val === 'number') return val;
      let strNum = String(val).replace(',', '.');
      return parseFloat(strNum) || 0;
    };

    async function inicializar() {
      try {
        const query = encodeURIComponent("SELECT A, B, C, D, E, F, G WHERE G = 'Em estoque'");
        
        // SOLUÇÃO 1: Quebra de Cache (Cache-Buster)
        // Isso obriga o navegador a pegar a versão mais recente da planilha a cada segundo!
        const cacheBuster = new Date().getTime();
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?sheet=${SHEET_NAME}&tq=${query}&tqx=out:json&_cb=${cacheBuster}`;
        
        const resp = await fetch(url);
        const text = await resp.text();
        const data = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));

        estoque = data.table.rows.map(r => ({
          id: r.c[0]?.v || '',
          bitola: parseNumSeguro(r.c[3]),
          medida: parseNumSeguro(r.c[4])
        }));

        const select = document.getElementById("buscaBitola");
        const bitolas = [...new Set(estoque.map(p => p.bitola))].filter(b => b > 0).sort((a,b) => a - b);
        select.innerHTML = '<option value="">Selecione...</option>' + bitolas.map(b => `<option value="${b}">${b.toFixed(2)}</option>`).join('');
      } catch (err) {
        showToast("Erro ao carregar planilha. Verifique a internet.", true);
      }
    }

    // BUSCA E CASAMENTO DE BARRAS
    function buscarEstoque() {
      const bitola = parseFloat(document.getElementById("buscaBitola").value);
      const medidaReq = parseFloat(document.getElementById("buscaMedida").value);
      const qtdeReq = parseInt(document.getElementById("buscaQtde").value) || 1;
      const res = document.getElementById("areaResultados");
      
      if (!bitola || isNaN(medidaReq)) { showToast("Preencha bitola e tamanho.", true); return; }

      let candidatas = estoque.filter(p => p.bitola === bitola && p.medida >= medidaReq)
                              .sort((a, b) => a.medida - b.medida);

      if (candidatas.length < qtdeReq) {
        res.innerHTML = `<div class="box" style="border-color:var(--danger)">❌ Só temos ${candidatas.length} barra(s) que atende(m) esse pedido.</div>`;
        return;
      }

      barrasSelecionadas = candidatas.slice(0, qtdeReq).map(c => ({
        id: c.id,
        medidaOriginal: c.medida,
        sobra: c.medida - medidaReq,
        bitola: c.bitola
      }));

      let html = `<div class="box"><h2>✅ Pontas Selecionadas</h2>`;
      barrasSelecionadas.forEach(b => {
        html += `
          <div class="result-card">
            <div class="result-info">
              <h3><span class="badge">ID #${b.id}</span> Barra Original de ${b.medidaOriginal.toFixed(2)}m</h3>
              <p>Bitola Ø ${b.bitola} mm</p>
            </div>
            <div class="sobra-box">
              <p style="margin:0; font-size:0.8rem; color:var(--text-muted)">SOBRA ESTIMADA</p>
              <div class="sobra-val">${b.sobra.toFixed(2)}m</div>
            </div>
          </div>
        `;
      });
      html += `<button class="btn" style="background:#10b981; margin-top:10px" onclick="confirmarBaixaAutomatica(this)">Confirmar Baixa Automática</button></div>`;
      res.innerHTML = html;
    }

    // PREVISÃO DA BARRA NA BAIXA MANUAL
    function preverBaixa() {
      const id = document.getElementById("baixaId").value;
      const previewDiv = document.getElementById("previewBaixa");
      const btnBaixar = document.getElementById("btnBaixar");

      if (!id) {
        previewDiv.innerHTML = "";
        btnBaixar.style.display = "none";
        return;
      }

      const barraEncontrada = estoque.find(b => b.id.toString() === id.toString());

      if (barraEncontrada) {
        previewDiv.innerHTML = `
          <div class="result-card" style="border-left-color: var(--danger); margin-top: 5px;">
            <div class="result-info">
              <h3><span class="badge" style="background:var(--danger)">ID #${barraEncontrada.id}</span> Barra Encontrada</h3>
              <p>Bitola Ø ${barraEncontrada.bitola.toFixed(2)} mm • Medida: ${barraEncontrada.medida.toFixed(2)}m</p>
            </div>
          </div>`;
        btnBaixar.style.display = "block";
      } else {
        previewDiv.innerHTML = `<div style="color: var(--danger); font-size: 0.9rem; margin-top: 10px;">❌ ID não encontrado no estoque ou já vendido.</div>`;
        btnBaixar.style.display = "none";
      }
    }

    // ENVIO PARA O GOOGLE SCRIPT (POST) - Com Solução 2
    async function enviarParaScript(payload, btnElement, txtLoading, txtOriginal) {
      btnElement.disabled = true;
      btnElement.innerText = txtLoading;
      try {
        const resp = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const json = await resp.json();
        
        if (json.sucesso) {
          showToast(json.mensagem);
        } else {
          showToast(json.mensagem, true);
        }
      } catch (err) {
        // SOLUÇÃO 2: Se der erro de conexão mas o Google salvou (Timeout)
        showToast("Comando enviado! Atualizando tela...", false);
      } finally {
        // Limpa os campos da tela
        document.getElementById("areaResultados").innerHTML = ""; 
        document.getElementById("baixaId").value = "";
        document.getElementById("previewBaixa").innerHTML = "";
        document.getElementById("btnBaixar").style.display = "none";
        
        // Aguarda 1,5 segundos para garantir a atualização no Google antes de reler o estoque
        setTimeout(() => {
            inicializar(); 
            btnElement.disabled = false;
            btnElement.innerText = txtOriginal;
        }, 1500);
      }
    }

    function confirmarBaixaAutomatica(btn) {
      const instrucoes = barrasSelecionadas.map(b => ({ id: b.id, sobra: b.sobra, bitola: b.bitola }));
      enviarParaScript({ action: "baixar", instrucoes: instrucoes }, btn, "Processando Baixa...", "Confirmar Baixa Automática");
    }

    function baixarManual() {
      const id = document.getElementById("baixaId").value;
      if (!id) return;
      enviarParaScript({ action: "baixar", instrucoes: [{ id: id, sobra: 0, bitola: 0 }] }, document.getElementById("btnBaixar"), "Processando...", "Confirmar Baixa (Vendido)");
    }

    function cadastrarPontas() {
      const bitola = document.getElementById("cadBitola").value;
      const medida = document.getElementById("cadMedida").value;
      const qtde = document.getElementById("cadQtde").value;
      if(!bitola || !medida) { showToast("Preencha todos os campos", true); return; }
      enviarParaScript({ action: "cadastrar", bitola: bitola, medida: medida, qtde: qtde }, document.getElementById("btnCadastrar"), "Salvando...", "Confirmar Cadastro");
    }

    // UI Utilities
    function switchTab(tabId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelector(`.tab[onclick="switchTab('${tabId}')"]`).classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('btnTheme').innerText = isDark ? '🌙' : '☀️';
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.className = isError ? "show error" : "show";
      setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 4000);
    }

    if (localStorage.getItem('theme') === 'dark') toggleTheme();
    inicializar();
  </script>
</body>
</html>
