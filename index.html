<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grande Aço - Controle de Estoque</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --bg-input: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --brand-500: #0ea5e9;
      --brand-600: #0284c7;
      --success: #10b981;
      --danger: #ef4444;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    html.dark {
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      transition: all 0.3s ease;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container { max-width: 800px; margin: 0 auto; }
    
    .hidden { display: none !important; }

    /* Cabeçalho */
    header { 
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; 
    }
    .header-content { display: flex; align-items: center; gap: 1rem; }
    .logo-container {
      background-color: #fff; border-radius: 50%; width: 5rem; height: 5rem;
      display: flex; align-items: center; justify-content: center; padding: 0.5rem;
      box-shadow: var(--shadow-sm); flex-shrink: 0;
    }
    .logo-img { width: 100%; height: 100%; object-fit: contain; }
    .title h1 { font-size: 1.5rem; font-weight: 700; }
    .title p { color: var(--text-muted); font-size: 0.9rem; }
    
    .btn-toggle {
      background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main);
      border-radius: 50%; width: 2.5rem; height: 2.5rem; cursor: pointer; transition: 0.2s;
    }

    /* Abas */
    .tabs { display: flex; gap: 1rem; border-bottom: 1px solid var(--border-color); margin-bottom: 1.5rem; }
    .tab-btn {
      background: none; border: none; padding: 0.75rem 1.5rem; font-weight: 600;
      color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: 0.2s;
    }
    .tab-btn.active { color: var(--brand-500); border-bottom-color: var(--brand-500); }
    .tab-content { display: none; animation: fadeIn 0.3s; }
    .tab-content.active { display: block; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* Cards e Formulários */
    .card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-sm);
    }
    .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; }
    
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-bottom: 1.5rem; }
    @media (min-width: 600px) { .form-grid { grid-template-columns: repeat(3, 1fr); } }
    
    .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
    label { font-size: 0.85rem; font-weight: 600; }
    input, select {
      padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.5rem;
      background: var(--bg-input); color: var(--text-main); font-size: 0.95rem; outline: none;
    }
    input:focus, select:focus { border-color: var(--brand-500); }

    .btn-submit {
      background: var(--brand-600); color: white; padding: 0.875rem 1.5rem; border: none;
      border-radius: 0.5rem; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%;
    }
    .btn-submit:hover:not(:disabled) { background: var(--brand-500); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-success { background: var(--success); }
    .btn-success:hover:not(:disabled) { background: #059669; }

    /* Resultados da Consulta (Cards Individuais) */
    .result-card {
      background: var(--bg-body); border: 1px solid var(--border-color); border-left: 4px solid var(--brand-500);
      border-radius: 0.5rem; padding: 1rem; margin-bottom: 0.75rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .result-info h3 { font-size: 1rem; margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.5rem; }
    .result-info p { font-size: 0.85rem; color: var(--text-muted); }
    .badge-id { background: var(--brand-500); color: white; padding: 0.2rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; }
    .sobra-box { text-align: right; }
    .sobra-box span { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
    .sobra-box strong { display: block; font-size: 1.25rem; color: var(--brand-500); }

    /* Toasts */
    .toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 9999; }
    .toast {
      padding: 1rem 1.25rem; border-radius: 0.5rem; background: var(--bg-card); color: var(--text-main);
      border-left: 4px solid var(--border-color); display: flex; align-items: center; gap: 0.75rem;
      box-shadow: var(--shadow-md); animation: slideIn 0.3s forwards; font-weight: 600; font-size: 0.9rem;
    }
    .toast.success { border-left-color: var(--success); }
    .toast.error { border-left-color: var(--danger); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</head>
<body>

  <div id="toast-container" class="toast-container"></div>

  <div class="container">
    <header>
      <div class="header-content">
        <div class="logo-container">
          <img src="image_1d6ea0.png" alt="Logo" class="logo-img" onerror="this.src='https://placehold.co/100/ffffff/0284c7?text=GA'">
        </div>
        <div class="title">
          <h1>Controle de Pontas</h1>
          <p>Painel Corporativo de Estoque</p>
        </div>
      </div>
      <button class="btn-toggle" onclick="toggleTheme()" id="themeBtn">🌓</button>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('tab-consulta', this)">🔍 Consulta Rápida</button>
      <button class="tab-btn" onclick="switchTab('tab-gerenciar', this)">⚙️ Gerenciar Estoque</button>
    </div>

    <div id="tab-consulta" class="tab-content active">
      <div class="card">
        <div class="section-title">Buscar Barras Disponíveis</div>
        <form onsubmit="event.preventDefault(); buscarPontas();">
          <div class="form-grid">
            <div class="input-group">
              <label>Bitola (mm)</label>
              <select id="buscaBitola" required><option value="" disabled selected>Carregando...</option></select>
            </div>
            <div class="input-group">
              <label>Tamanho (m)</label>
              <input type="number" id="buscaMedida" step="0.01" min="0.1" placeholder="Ex: 2.50" required>
            </div>
            <div class="input-group">
              <label>Quantidade</label>
              <input type="number" id="buscaQtde" step="1" min="1" value="1" required>
            </div>
          </div>
          <button type="submit" id="btnBuscar" class="btn-submit">Pesquisar Estoque</button>
        </form>
      </div>

      <div id="areaResultados" class="card hidden" style="border-color: var(--brand-500);">
        <div class="section-title" style="color: var(--brand-500);">Pontas Selecionadas</div>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">O sistema selecionou as seguintes barras individualmente, priorizando a menor sobra:</p>
        
        <div id="listaCards"></div>

        <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
          <button id="btnBaixaAuto" class="btn-submit btn-success" onclick="confirmarBaixa()">Confirmar Baixa Automática</button>
        </div>
      </div>
    </div>

    <div id="tab-gerenciar" class="tab-content">
      <div class="card">
        <div class="section-title">Cadastrar Nova Ponta</div>
        <form onsubmit="event.preventDefault(); cadastrarPonta();">
          <div class="form-grid">
            <div class="input-group">
              <label>Bitola (mm)</label>
              <input type="number" id="cadBitola" step="0.01" placeholder="Ex: 8.00" required>
            </div>
            <div class="input-group">
              <label>Medida (m)</label>
              <input type="number" id="cadMedida" step="0.01" min="0.1" placeholder="Ex: 3.50" required>
            </div>
            <div class="input-group">
              <label>Quantidade</label>
              <input type="number" id="cadQtde" step="1" min="1" value="1" required>
            </div>
          </div>
          <button type="submit" id="btnCadastrar" class="btn-submit btn-success" style="width: auto;">Cadastrar no Estoque</button>
        </form>
      </div>

      <div class="card">
        <div class="section-title">Baixa Manual (Saída)</div>
        <form onsubmit="event.preventDefault(); baixarManual();">
          <div class="input-group" style="max-width: 300px; margin-bottom: 1rem;">
            <label>Código/ID da Ponta</label>
            <input type="number" id="baixaId" step="1" min="1" placeholder="Digite o ID da planilha" required>
          </div>
          <button type="submit" id="btnBaixaManual" class="btn-submit" style="width: auto; background: var(--danger);">Confirmar Baixa do ID</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const SHEET_ID = "1dtIpGk97RggIA7E-4diWtiEPa0GbI6d1i_F7UsA9CtI";
    const POST_URL = "https://script.google.com/macros/s/AKfycbxyg4MHYtu4-GPzV-Nz_7oy0sroUusx5HuIjkPFCQr9rno_q3GFcUPTVgwuXkz6ZrRy/exec";
    
    let estoquePontas = [];
    let selecaoAtual = [];

    // --- UTILS (Tema e Tabs) ---
    function initTheme() {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('themeBtn').innerText = '☀️';
      } else {
        document.getElementById('themeBtn').innerText = '🌙';
      }
    }
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('themeBtn').innerText = isDark ? '☀️' : '🌙';
    }
    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btnElement.classList.add('active');
    }
    function showToast(msg, type = 'success') {
      const box = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span> <span>${msg}</span>`;
      box.appendChild(t);
      setTimeout(() => { t.remove(); }, 4000);
    }

    // --- LEITURA DE DADOS (GET) ---
    async function carregarEstoque() {
      try {
        const query = encodeURIComponent("SELECT A, B, C, D, E, F, G WHERE G = 'Em estoque'");
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=Pontas&tq=${query}&tqx=out:json`;
        
        const resp = await fetch(url);
        const text = await resp.text();
        const data = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
        
        estoquePontas = [];
        const parseNum = (v) => parseFloat(String(v || '0').replace(/\./g, '').replace(',', '.')) || 0;

        data.table.rows.forEach(r => {
          const id = r.c[0]?.v;
          const qtde = parseInt(r.c[2]?.v) || 1;
          const bitola = String(r.c[3]?.v || '').trim();
          const medida = parseNum(r.c[4]?.v);
          
          if(id && medida > 0) {
            for(let i = 0; i < qtde; i++) {
              estoquePontas.push({ id, bitola, medida });
            }
          }
        });

        // Preenche dropdown
        const sel = document.getElementById("buscaBitola");
        const bitolas = [...new Set(estoquePontas.map(p => p.bitola))].sort((a,b) => parseFloat(a.replace(',','.')) - parseFloat(b.replace(',','.')));
        sel.innerHTML = '<option value="" disabled selected>Escolha a bitola...</option>';
        bitolas.forEach(b => sel.innerHTML += `<option value="${b}">Ø ${b} mm</option>`);
      } catch (err) {
        showToast("Erro ao ler dados da planilha.", "error");
      }
    }

    // --- LÓGICA DE BUSCA (CASAMENTO INDIVIDUAL) ---
    function buscarPontas() {
      const bitolaReq = document.getElementById("buscaBitola").value;
      const medidaReq = parseFloat(document.getElementById("buscaMedida").value);
      const qtdeReq = parseInt(document.getElementById("buscaQtde").value);

      if (!bitolaReq || isNaN(medidaReq) || qtdeReq < 1) return;

      // Filtra as que servem e ordena da menor sobra para a maior sobra
      let barrasAptas = estoquePontas.filter(p => p.bitola === bitolaReq && p.medida >= medidaReq);
      barrasAptas.sort((a, b) => (a.medida - medidaReq) - (b.medida - medidaReq));

      if (barrasAptas.length < qtdeReq) {
        showToast(`Estoque insuficiente! Encontradas apenas ${barrasAptas.length} barras aptas.`, "error");
        document.getElementById("areaResultados").classList.add("hidden");
        return;
      }

      // Seleciona exatamente a quantidade pedida (1 card para cada)
      selecaoAtual = barrasAptas.slice(0, qtdeReq).map(b => ({
        id: b.id,
        bitola: b.bitola,
        medidaOriginal: b.medida,
        sobra: b.medida - medidaReq
      }));

      renderizarCards();
    }

    function renderizarCards() {
      const div = document.getElementById("listaCards");
      div.innerHTML = "";
      
      selecaoAtual.forEach(item => {
        div.innerHTML += `
          <div class="result-card">
            <div class="result-info">
              <h3><span class="badge-id">ID #${item.id}</span> Barra Original de ${item.medidaOriginal.toFixed(2)}m</h3>
              <p>Bitola Ø ${item.bitola} mm</p>
            </div>
            <div class="sobra-box">
              <span>Sobra Estimada</span>
              <strong>${item.sobra.toFixed(2)}m</strong>
            </div>
          </div>
        `;
      });
      document.getElementById("areaResultados").classList.remove("hidden");
    }

    // --- ENVIOS PARA A PLANILHA (POST) ---
    async function confirmarBaixa() {
      const btn = document.getElementById("btnBaixaAuto");
      btn.disabled = true; btn.innerText = "Processando...";
      
      // Monta payload de acordo com o Apps Script: array 'instrucoes' com {id, bitola, sobra}
      const payload = { action: "baixar", instrucoes: selecaoAtual };

      try {
        const resp = await fetch(POST_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
        const res = await resp.json();
        if (res.sucesso) {
          showToast("Baixa registrada com sucesso!", "success");
          document.getElementById("areaResultados").classList.add("hidden");
          carregarEstoque(); // Atualiza a tela
        } else {
          showToast(res.mensagem, "error");
        }
      } catch (err) {
        showToast("Erro de rede ao confirmar baixa.", "error");
      } finally {
        btn.disabled = false; btn.innerText = "Confirmar Baixa Automática";
      }
    }

    async function cadastrarPonta() {
      const btn = document.getElementById("btnCadastrar");
      btn.disabled = true; btn.innerText = "Enviando...";
      
      const payload = {
        action: "cadastrar",
        bitola: document.getElementById("cadBitola").value,
        medida: document.getElementById("cadMedida").value,
        qtde: document.getElementById("cadQtde").value
      };

      try {
        const resp = await fetch(POST_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
        const res = await resp.json();
        if (res.sucesso) {
          showToast("Cadastrado com sucesso!", "success");
          document.getElementById("cadBitola").value = "";
          document.getElementById("cadMedida").value = "";
          document.getElementById("cadQtde").value = "1";
          carregarEstoque();
        } else {
          showToast("Erro ao cadastrar.", "error");
        }
      } catch (err) {
        showToast("Erro de comunicação.", "error");
      } finally {
        btn.disabled = false; btn.innerText = "Cadastrar no Estoque";
      }
    }

    async function baixarManual() {
      const btn = document.getElementById("btnBaixaManual");
      const idVal = document.getElementById("baixaId").value;
      if(!idVal) return;
      
      btn.disabled = true; btn.innerText = "Baixando...";
      // Para baixa manual, enviamos a instrução com sobra 0 para não gerar retalhos acidentais
      const payload = { action: "baixar", instrucoes: [{ id: parseInt(idVal), sobra: 0 }] };

      try {
        const resp = await fetch(POST_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
        const res = await resp.json();
        if (res.sucesso) {
          showToast(`Baixa do ID ${idVal} confirmada!`, "success");
          document.getElementById("baixaId").value = "";
          carregarEstoque();
        } else {
          showToast(res.mensagem || "ID não encontrado.", "error");
        }
      } catch (err) {
        showToast("Erro na ligação.", "error");
      } finally {
        btn.disabled = false; btn.innerText = "Confirmar Baixa do ID";
      }
    }

    // --- INICIALIZAÇÃO ---
    window.onload = () => {
      initTheme();
      carregarEstoque();
    };
  </script>
</body>
</html>
